<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>ReachAI Status</title>
    <style>
      body { font-family: sans-serif; margin: 40px; }
      .card { border: 1px solid #ddd; padding: 20px; margin-bottom: 16px; border-radius: 8px; }
      .stats { display: grid; grid-template-columns: repeat(3, minmax(150px, 1fr)); gap: 12px; }
      .stat { background: #f6f8fa; border-radius: 6px; padding: 12px; }
    </style>
  </head>
  <body>
    <h1>ReachAI</h1>
    <div class="card">
      <h2>Today</h2>
      <div class="stats">
        <div class="stat"><strong>Jobs discovered</strong><br />1</div>
        <div class="stat"><strong>Qualified jobs</strong><br />1</div>
        <div class="stat"><strong>Pending approval</strong><br />1</div>
        <div class="stat"><strong>Approved</strong><br />0</div>
        <div class="stat"><strong>Sent</strong><br />0</div>
        <div class="stat"><strong>Rejected</strong><br />0</div>
      </div>
    </div>
    <div class="card">
      <h2>Top target</h2>
      <p>Sarah Chen — Northstar Labs — 92</p>
    </div>
  </body>
</html>
