[project]
name = "reachai"
version = "0.1.0"
description = "Local-first AI outreach assistant"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.9.2",
  "python-dotenv>=1.0.1",
  "pyyaml>=6.0.2",
  "httpx>=0.27.0",
  "openai>=1.40.0",
  "google-api-python-client>=2.160.0",
  "google-auth>=2.35.0",
  "google-auth-oauthlib>=1.2.1",
  "resend>=2.0.0",
  "beautifulsoup4>=4.12.3",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"
